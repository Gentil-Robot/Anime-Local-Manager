name: ALM - controle des sources (PR)

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alm-source-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout integral avec Git LFS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - name: Node version epinglee
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Integrite et scanner local des sources
        shell: pwsh
        run: |
          node scripts/check-source-files.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/audit-publication.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Dependances verrouillees
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit production et outillage
        shell: pwsh
        run: |
          npm audit --audit-level=high
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verification complete du projet
        shell: pwsh
        run: |
          node scripts/verify-project.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
