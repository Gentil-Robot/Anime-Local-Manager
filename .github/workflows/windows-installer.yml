name: ALM — installateur Windows (validation uniquement)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update-helper:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/v2.2.0'
    concurrency:
      group: alm-helper-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Sources du lanceur
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node epingle
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Confirmation native du lanceur Windows
        run: node scripts/probe-windows-update-helper.cjs
  installer:
    concurrency:
      group: alm-build-${{ github.ref }}
      cancel-in-progress: true
    needs: update-helper
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - name: Node et cache npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Cache des téléchargements Electron et NSIS
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6, official tag verified 2026-10-25
        with:
          path: ${{ runner.temp }}/alm-downloads
          key: alm-downloads-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: alm-downloads-${{ runner.os }}-
      - name: Construction, contrôles et essais de l’installation
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/alm-downloads/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/alm-downloads/builder
        run: |
          node scripts/release-windows.js --ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installateur et rapport final
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ALM-Windows-${{ github.sha }}
          path: |
            dist/*Setup-x64.exe
            dist/release-check.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Parcours natifs moteur et MFA
        run: |
          node scripts/verify-native.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Journaux de vérification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ALM-Diagnostics-${{ github.run_id }}
          path: |
            logs/
            .release-work/*/verification.json
            .release-work/*/verification.log
            .release-work/*/audit-production.json
            .release-work/*/audit-outillage.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
