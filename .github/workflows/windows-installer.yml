name: ALM — installateur Windows
on:
  workflow_dispatch:
  push:
    branches: [main, master, 'publication/v2.0.0-beta-stable', 'release/v2.1.2']
    tags: ['v*', '2.0.0-*']
permissions:
  contents: read
concurrency:
  group: alm-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update-helper:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Sources du lanceur
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node epingle
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Confirmation native du lanceur Windows
        run: node scripts/probe-windows-update-helper.cjs
  installer:
    needs: update-helper
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - name: Node et cache npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Cache des téléchargements Electron et NSIS
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6, official tag verified 2026-10-25
        with:
          path: ${{ runner.temp }}/alm-downloads
          key: alm-downloads-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: alm-downloads-${{ runner.os }}-
      - name: Construction, contrôles et essais de l’installation
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/alm-downloads/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/alm-downloads/builder
          CSC_LINK: ${{ secrets.ALM_WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.ALM_WINDOWS_CERTIFICATE_PASSWORD }}
          ALM_SIGNER_SUBJECT: ${{ vars.ALM_WINDOWS_SIGNER_SUBJECT }}
        run: |
          node scripts/release-windows.js --ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installateur et rapport final
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ALM-Windows-${{ github.sha }}
          path: |
            dist/*Setup-x64.exe
            dist/release-check.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Parcours natifs moteur et MFA
        run: |
          node scripts/verify-native.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Journaux de vérification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ALM-Diagnostics-${{ github.run_id }}
          path: |
            logs/
            .release-work/*/verification.json
            .release-work/*/verification.log
            .release-work/*/audit-production.json
            .release-work/*/audit-outillage.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/v2.1.2'
    needs: installer
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Sources exactes de la version testee
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - name: Node epingle
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Installateur et rapport testes
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ALM-Windows-${{ github.sha }}
          path: dist
      - name: Publication 2.1.2 apres verification des preuves
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & ./Publier-GitHub-V2.ps1 -Installateur './dist/Anime-Local-Manager-2.1.2-Setup-x64.exe' -RapportBuild './dist/release-check.json' -Tag 'v2.1.2' -Ref 'release/v2.1.2' -Publier
